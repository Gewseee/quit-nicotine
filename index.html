<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quit Nicotine Assistant</title>
    <style>
        :root { --primary: #4CAF50; --danger: #ff4444; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background-color: var(--bg); color: #333; }
        .container { max-width: 450px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input, select { padding: 12px; width: 100%; box-sizing: border-box; margin: 10px 0; border: 2px solid #eee; border-radius: 8px; font-size: 16px; }
        button { padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin: 8px 0; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: scale(0.99); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .secondary-btn { background: #6c757d; }
        .cancel-btn { background: var(--danger); }
        .hidden { display: none; }
        .status-badge { font-size: 11px; color: #999; margin-bottom: 15px; }
        #countdown { font-size: 54px; font-weight: bold; margin: 20px 0; color: var(--primary); }
        .cookie-banner { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 25px; border-radius: 50px; display: flex; align-items: center; gap: 15px; z-index: 1000; font-size: 13px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .cookie-banner button { width: auto; margin: 0; padding: 5px 15px; background: white; color: #333; }
    </style>
</head>
<body>
    <div class="container" id="app-container">
        <div id="cloud-info" class="status-badge">Требуется вход</div>
        <h1>Quit Nicotine</h1>

        <div id="login-section">
            <p>Введите ваш персональный код:</p>
            <input type="text" id="short-code" placeholder="Например: 777">
            <button onclick="app.handleLogin()">Войти</button>
            <button class="secondary-btn" onclick="app.createNewUser()">Создать новый профиль</button>
        </div>

        <div id="vape-form" class="hidden">
            <h2>Настроить план</h2>
            <select id="vape-frequency">
                <option value="90" selected>Раз в 1-2 часа</option>
                <option value="20">Раз в 15-30 минут</option>
                <option value="360">Раз в 6+ часов</option>
            </select>
            <input type="number" id="vape-duration" value="3" placeholder="Мин. сеанса">
            <p>Старт:</p><input type="date" id="start-date">
            <p>Финиш:</p><input type="date" id="end-date">
            <button onclick="app.saveNewPlan()">Запустить</button>
        </div>

        <div id="plan-section" class="hidden">
            <div id="plan-active">
                <div id="countdown">00:00</div>
                <p>Дней до конца: <span id="info-days">0</span> | Сеанс: <span id="info-dur">0</span> мин</p>
                <button id="action-btn" onclick="app.startSession()">Начать парение</button>
                <button class="secondary-btn" onclick="app.editPlan()">Настройки</button>
                <button class="secondary-btn" onclick="app.showSection('tips-section')">Советы</button>
                <button class="cancel-btn" onclick="app.resetProgress()">Сорвался</button>
            </div>
            <div id="freeze-section" class="hidden">
                <h2 id="freeze-message"></h2>
                <button class="secondary-btn" onclick="app.editPlan()">Изменить дату</button>
            </div>
        </div>

        <div id="tips-section" class="hidden">
            <h2>Советы</h2>
            <p>💧 Пейте воду. 🍬 Жвачка. 🧘 Глубокое дыхание.</p>
            <button onclick="app.showSection('plan-section')">Назад</button>
        </div>
    </div>

    <div id="cookie-notice" class="cookie-banner hidden">
        <span>Данные сохраняются для прогресса</span>
        <button onclick="app.acceptCookies()">Ок</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
